# ngntun 用の DHCPv6 クライアント設定
#
# 設置先の例: /etc/ngntun/dhclient6.conf
# 使い方:
#   dhclient -6 -P -cf /etc/ngntun/dhclient6.conf \
#            -sf /usr/local/sbin/ngntun-dhclient-script \
#            -lf /var/lib/dhcp/ngntun6.leases -pf /run/ngntun-d6.pid <IF>
#
# 【重要】Vendor Class (option 16) を送らないと、HGW は内線番号を割り当ててくれない。
# 引き金になるのは【オプションを送ること自体】で、中身は問われない。
#
# 送る中身は「enterprise-number + 長さ + MAC アドレス」という構造だが、実機で確かめたところ
# enterprise-number も MAC も HGW は検証していない。両方とも出鱈目な値にしても内線番号は
# 割り当てられ、REGISTER まで通る。したがって末尾 6 バイトを自分の MAC に書き換える必要はない。
#
# それでもこの形で送っているのは、対応ルーター (RTX810) が実際に送っていたものに合わせている
# ため。将来ファームウェアが検証を始めたときに壊れないよう、実機に倣った形を保つ。
#
# HGW が内線番号を紐づけている識別子は【DUID】のほう。ベンダオプション code 201 で返って
# くる MAC も、ここに書いた値ではなく DUID (Client-ID) 内の MAC である。dhclient の
# DUID-LLT は自分の MAC から作られるので、両者は普段たまたま一致する。
# DUID が変わると別の端末とみなされ、新しい内線番号が払い出される。
#
# ISC dhclient は dhcp6.vendor-class を定義していないため、生バイト列として自分で定義する。
# (定義せずに send しようとすると "no option named vendor-class in space dhcp6" という
#  エラーを出しつつ、dhclient はそのまま送信を続けてしまうので気づきにくい)
option dhcp6.vendor-class code 16 = string;
send dhcp6.vendor-class 00:00:04:9e:00:06:00:00:5e:00:53:22;

also request dhcp6.sip-servers-addresses,
             dhcp6.sip-servers-names,
             dhcp6.vendor-opts,
             dhcp6.domain-search,
             dhcp6.name-servers;
